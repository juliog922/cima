# =============================================================================
# registry.toml — the certified model set. Single source of truth:
# docs/models.md and the CLI listing are generated from this file, and
# .github/workflows/models-nightly.yml re-preflights every row.
#
# Certification levels:
#   verified            full `cima vet` battery passed on real hardware
#   verified-by-family  metadata preflight passed AND a smaller family
#                       member holds a `verified` row
#   avoid               known-defective artifact, listed to warn
#
# A row requires: the vet or preflight report attached to the admitting PR.
# =============================================================================

[[model]]
