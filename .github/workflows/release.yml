# =============================================================================
# release — immutable semver artifacts, on an annotated tag `vX.Y.Z`.
#
# This is the DELIBERATE release path (distinct from ci.yml's publish-on-merge,
# which ships a rolling image from Cargo.toml's version). A tag publishes
# permanent `X.Y.Z` / `X.Y` / `latest` image tags to the registry and cuts a
# GitHub Release with notes + the model certification bundle.
#
# Tests are RE-RUN here before anything is pushed: the tag must point at a
# commit that passes unit tests and the on-hardware suite, so a release can
# never ship code that wasn't verified. (The tag being on main — which is
# itself protected by ci — is necessary but not sufficient; we verify again.)
#
# Cut a release:   git tag v0.2.0 && git push origin v0.2.0
# (Bump Cargo.toml's version to match in the SAME commit the tag points at.)
# =============================================================================
name: release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE: ${{ vars.IMAGE || github.repository }}

jobs:
  verify:
    # Fast CPU gate. The heavier on-hardware suite runs in `verify-gpu`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.83"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$cargo_v" ]; then
            echo "::error::tag v$tag != Cargo.toml version $cargo_v — bump Cargo.toml to match the tag"
            exit 1
          fi
          echo "release version $cargo_v"
      - name: Format / clippy / unit tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  verify-gpu:
    runs-on: [self-hosted, gpu]
    env:
      COMPOSE_FILE: docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Numerical selftest + API/behaviour suite
        run: |
          docker compose up -d --build cima
          docker compose exec -T cima cima selftest
          bash scripts/test.sh
      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans || true

  publish:
    needs: [verify, verify-gpu]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Model certification bundle
        run: |
          mkdir -p dist
          cp registry.toml dist/ 2>/dev/null || true
          cp docs/models.md dist/ 2>/dev/null || true
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*